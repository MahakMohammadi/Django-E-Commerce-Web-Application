{% load static %}
<div class="col-6 col-sm-4 col-md-3 col-xl-2 mb-3">
    <div class="card product-card h-100 shadow-sm">
        {% with first_image=product.images.first %}
            {% if first_image %}
                <img src="{{ first_image.image.url }}" class="card-img-top" alt="{{ product.title }}" loading="lazy">
            {% else %}
                <div class="placeholder-img">No image</div>
            {% endif %}
        {% endwith %}
        <div class="card-body d-flex flex-column">
            <h6 class="product-title mb-1">
                <a href="{% url 'store:product_detail' product.slug %}" class="stretched-link text-decoration-none text-dark">
                    {{ product.title }}
                </a>
            </h6>
            <p class="text-muted product-collection mb-1">{{ product.collection.title }}</p>
            <p class="price-tag mb-0 mt-auto">${{ product.unit_price }}</p>
        </div>
    </div>
</div>
